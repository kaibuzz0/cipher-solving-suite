name: Deploy operations dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "toolsets/**"
      - "tools/**"
      - "scripts/**"
      - "research/**"
      - "docs/**"
      - "ops/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate intelligence source registry
        run: python scripts/source_registry.py validate
      - name: Validate intelligence feed
        run: python scripts/intelligence_feed.py validate
      - name: Validate source check history
        run: python scripts/source_check_history.py validate
      - name: Build repository dashboard data
        run: python scripts/build_site_data.py
      - name: Build agent operations data
        run: python scripts/build_agent_ops.py
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/data _site/docs _site/ops
          cp -R site/. _site/
          cp README.md _site/README.md
          cp data/opportunities.json data/prompts.json data/tools.json data/intelligence.json data/intelligence_sources.json data/integration_queue.json _site/data/
          cp site-data/cases.json site-data/toolsets.json site-data/repository.json site-data/status.json site-data/sources.json site-data/collection-health.json site-data/artifacts.json site-data/agent-ops.json _site/data/
          cp AGENTS.md _site/AGENTS.md
          cp docs/AGENT_HANDOFF.md docs/CASE_WORKFLOW.md docs/INTELLIGENCE_WORKFLOW.md docs/REPO_MAINTENANCE.md docs/WORK_QUEUE.md _site/docs/
          cp ops/CURRENT_STATE.md _site/ops/CURRENT_STATE.md
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="agent_ops.js?v=1"></script>'
          if marker not in text:
              text = text.replace('</body>', marker + '\n</body>')
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
