name: Core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade "pytest>=8,<10"
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -vv --tb=short --junitxml=test-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
      - name: Compile core tools
        id: compile
        continue-on-error: true
        run: |
          python -m py_compile suite.py tools/opportunity_finder.py tools/earnings_tracker.py tools/scanning/opportunity_scanner.py scripts/maintenance_check.py scripts/new_case.py scripts/build_site_data.py scripts/intelligence_feed.py scripts/source_registry.py scripts/source_check_history.py scripts/artifact_inventory.py scripts/verify_310_migration.py
          python -m py_compile research/active-puzzles/20260816-310-btc-challenge/tools/alpha_extract.py research/active-puzzles/20260816-310-btc-challenge/tools/analyze_310.py
      - name: Validate intelligence source registry
        id: sources
        continue-on-error: true
        run: python scripts/source_registry.py validate
      - name: Validate source check history
        id: history
        continue-on-error: true
        run: python scripts/source_check_history.py validate
      - name: Build source collection report
        id: source_report
        continue-on-error: true
        run: python scripts/source_check_history.py report
      - name: Validate intelligence feed
        id: intelligence
        continue-on-error: true
        run: python scripts/intelligence_feed.py validate
      - name: Build artifact inventory
        id: artifacts
        continue-on-error: true
        run: |
          python scripts/artifact_inventory.py scan
          python scripts/artifact_inventory.py validate
      - name: Verify 310 evidence migration
        id: migration310
        continue-on-error: true
        run: python scripts/verify_310_migration.py
      - name: Build dashboard data
        id: dashboard
        continue-on-error: true
        run: python scripts/build_site_data.py
      - name: Maintenance check
        id: maintenance
        continue-on-error: true
        run: python scripts/maintenance_check.py
      - name: Upload dashboard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-python-${{ matrix.python-version }}
          path: site-data/
          if-no-files-found: warn
      - name: Upload intelligence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-data-python-${{ matrix.python-version }}
          path: |
            data/intelligence.json
            data/intelligence_sources.json
            data/source_check_history.json
            artifacts/intelligence-source-report.json
          if-no-files-found: warn
      - name: Upload artifact inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-inventory-python-${{ matrix.python-version }}
          path: artifacts/artifact-inventory.json
          if-no-files-found: warn
      - name: Upload 310 migration verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-310-python-${{ matrix.python-version }}
          path: artifacts/310-migration-verification.json
          if-no-files-found: warn
      - name: Upload maintenance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-python-${{ matrix.python-version }}
          path: artifacts/maintenance-report.json
          if-no-files-found: warn
      - name: Validation summary
        if: always()
        run: |
          echo "### Python ${{ matrix.python-version }} validation" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ steps.tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile | ${{ steps.compile.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source registry | ${{ steps.sources.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source check history | ${{ steps.history.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source report | ${{ steps.source_report.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Intelligence feed | ${{ steps.intelligence.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact inventory | ${{ steps.artifacts.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 310 migration integrity | ${{ steps.migration310.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard data | ${{ steps.dashboard.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Maintenance | ${{ steps.maintenance.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail job if validation failed
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ] || \
             [ "${{ steps.compile.outcome }}" != "success" ] || \
             [ "${{ steps.sources.outcome }}" != "success" ] || \
             [ "${{ steps.history.outcome }}" != "success" ] || \
             [ "${{ steps.source_report.outcome }}" != "success" ] || \
             [ "${{ steps.intelligence.outcome }}" != "success" ] || \
             [ "${{ steps.artifacts.outcome }}" != "success" ] || \
             [ "${{ steps.migration310.outcome }}" != "success" ] || \
             [ "${{ steps.dashboard.outcome }}" != "success" ] || \
             [ "${{ steps.maintenance.outcome }}" != "success" ]; then
            echo "One or more validation stages failed. Review the named step, short traceback, job summary, and uploaded diagnostics."
            exit 1
          fi
