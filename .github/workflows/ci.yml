name: Core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run test suite
        run: |
          pytest tests/ \
            -vv \
            --tb=short \
            --junitxml=test-results.xml

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn

      - name: Compile core tools
        run: |
          python -m py_compile suite.py tools/opportunity_finder.py tools/earnings_tracker.py tools/scanning/opportunity_scanner.py scripts/maintenance_check.py scripts/new_case.py

      - name: Maintenance check
        run: python scripts/maintenance_check.py

      - name: Upload maintenance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-python-${{ matrix.python-version }}
          path: artifacts/maintenance-report.json
          if-no-files-found: warn
