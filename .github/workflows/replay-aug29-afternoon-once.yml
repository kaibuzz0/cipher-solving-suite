name: Replay Aug 29 afternoon once

on:
  push:
    branches:
      - build/aug29-afternoon-replay-20260913

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay protected snapshot
        run: |
          python scripts/source_check_history.py replay-snapshot intelligence/feeds/2026-08-29-afternoon-source-health.json
          python scripts/source_check_history.py validate
          python scripts/source_registry.py validate
          python -m pytest tests/test_aug29_afternoon_source_readiness.py -q
      - name: Assert bounded semantic diff and reconcile queue
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          history_path = Path('data/source_check_history.json')
          registry_path = Path('data/intelligence_sources.json')
          queue_path = Path('data/integration_queue.json')

          history = json.loads(history_path.read_text())
          matches = [c for c in history['checks'] if c.get('source_id') == 'ethglobal-events' and c.get('checked_at') == '2026-08-29T19:40:52Z']
          assert len(matches) == 1, matches
          entry = matches[0]
          assert entry['content_fingerprint'] == '361c6c0ce2988ea281442a7b6b6ac8ca94574cda8074242b2d7966fed9037179'
          assert entry['previous_fingerprint'] == '5b270d1af189b17c8508993b6c5ed10d6794acec5e254eee7dc77f2c2f84925c'
          assert entry['change_state'] == 'changed'
          assert len(history['checks']) == 78

          registry = json.loads(registry_path.read_text())
          sources = {s['id']: s for s in registry['sources']}
          assert sources['ethglobal-events']['last_checked_at'] == '2026-08-29T19:40:52Z'
          for sid in ('challenge-gov','ctftime-upcoming','sherlock-bounties','arxiv-cryptography'):
              assert sources[sid]['last_checked_at'] == '2026-08-29T07:38:35Z', (sid, sources[sid]['last_checked_at'])

          queue = json.loads(queue_path.read_text())
          item = next(x for x in queue['items'] if x['id'] == '20260829-pr85-pr91-source-health-research')
          item['status'] = 'integrated'
          item['contributor'] = item['contributor'] + '; afternoon replay by build-agent one-shot workflow'
          item['branch_or_pr'] = item['branch_or_pr'] + '; Aug. 29 afternoon replay staged on build/aug29-afternoon-replay-20260913'
          item['summary'] = 'PR #148 made exactly five 2026-08-29T07:38:35Z morning records canonical. This build replay adds exactly one 2026-08-29T19:40:52Z ethglobal-events record and advances only that matching registry timestamp; raw Aug. 29 snapshots remain unchanged.'
          item['verification'] = f"Native replay plus source-history/source-registry validation and tests/test_aug29_afternoon_source_readiness.py passed in GitHub Actions run {os.environ['RUN_ID']}. Exact-head Core/Source Report/Maintenance/Pages still require independent PR validation before merge."
          item['next_action'] = 'Independently inspect the one-record/one-registry replay diff and exact-head CI; after merge, Aug. 30 morning becomes the next chronology gate.'
          queue['updated_at'] = '2026-09-13T08:00:00Z'
          queue_path.write_text(json.dumps(queue, indent=2) + '\n')
          PY
      - name: Append handoff and remove one-shot workflow
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('docs/AGENT_HANDOFF.md')
          entry = f'''\n---\n\n### 2026-09-13 08:00 UTC — Build Integration / Aug. 29 afternoon canonical replay\n\n- **Branch / PR:** `build/aug29-afternoon-replay-20260913` / PR pending\n- **Objective:** Execute the protected Aug. 29 afternoon source-health replay through the repository-native replay command after PR #169 reconciled the integration inbox.\n- **Changed:** Native replay added exactly one `ethglobal-events` canonical history record at `2026-08-29T19:40:52Z`, advanced only `ethglobal-events.last_checked_at` to that timestamp, and reconciled the Aug. 29 integration-queue item to integrated. The raw snapshot was not modified.\n- **Verification:** `python scripts/source_check_history.py replay-snapshot intelligence/feeds/2026-08-29-afternoon-source-health.json`; `python scripts/source_check_history.py validate`; `python scripts/source_registry.py validate`; `python -m pytest tests/test_aug29_afternoon_source_readiness.py -q`; bounded assertions confirmed 78 total history records, exact fingerprint/predecessor, and no morning-source timestamp drift. One-shot workflow run `{os.environ['RUN_ID']}`: {os.environ['RUN_URL']}.\n- **Evidence / artifacts:** fingerprint `361c6c0ce2988ea281442a7b6b6ac8ca94574cda8074242b2d7966fed9037179`; predecessor `5b270d1af189b17c8508993b6c5ed10d6794acec5e254eee7dc77f2c2f84925c`; `data/source_check_history.json`; `data/intelligence_sources.json`; `data/integration_queue.json`.\n- **Known risks / blockers:** This workflow establishes native replay output only. Exact-head Core matrix, Intelligence Source Report, Daily Maintenance, Pages compatibility, review-thread state, and independent semantic diff review remain required before merge. Later Sep. research remains noncanonical.\n- **Next action:** Independently verify the branch diff contains exactly one new ETHGlobal history record, one corresponding registry timestamp advance, the queue reconciliation and this append-only handoff; require full CI/Pages compatibility before merging. After merge, process Aug. 30 morning next.\n'''
          p.write_text(p.read_text() + entry)
          PY
          rm .github/workflows/replay-aug29-afternoon-once.yml
      - name: Commit native replay output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_check_history.json data/intelligence_sources.json data/integration_queue.json docs/AGENT_HANDOFF.md .github/workflows/replay-aug29-afternoon-once.yml
          git commit -m 'data: replay Aug 29 afternoon source health'
          git push origin HEAD:build/aug29-afternoon-replay-20260913
